<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador de Corridas Mario Kart</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <div id="round-result-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="round-result-title">Resultado da Rodada</h2>
      <div id="round-result-body"></div>
      <button id="close-round-modal">Fechar</button>
    </div>
  </div>

  <div id="winner-modal" class="modal hidden">
    <div class="modal-content">
      <span id="close-modal" class="close-button">Fechar ✖</span>
      <h2 id="modal-title"></h2>

      <div id="modal-image-container" class="modal-image-container"></div>

      <p id="modal-subtitle"></p>
    </div>
  </div>

  <body>
    <div class="box-character">
      <h1>Simulador de Corridas Mario Kart</h1>

      <section id="tutorial">
        <b>Pistas:</b>

        <ul>
          <li>
            <input type="checkbox" id="pistas-1-item" />
            <label for="pistas-1-item"
              >Os personagens irão correr em uma pista aleatória de 5
              rodadas</label
            >
          </li>
          <li>
            <input type="checkbox" id="pistas-2-item" />
            <label for="pistas-2-item"
              >A cada rodada, será sorteado um bloco da pista que pode ser uma
              reta, curva ou confronto</label
            >
            <ul>
              <li>
                <input type="checkbox" id="pistas-2-1-item" />
                <label for="pistas-2-1-item"
                  >Caso o bloco da pista seja uma RETA, o jogador deve jogar um
                  dado de 6 lados e somar o atributo VELOCIDADE, quem vencer
                  ganha um ponto</label
                >
              </li>
              <li>
                <input type="checkbox" id="pistas-2-2-item" />
                <label for="pistas-2-2-item"
                  >Caso o bloco da pista seja uma CURVA, o jogador deve jogar um
                  dado de 6 lados e somar o atributo MANOBRABILIDADE, quem
                  vencer ganha um ponto</label
                >
              </li>
              <li>
                <input type="checkbox" id="pistas-2-3-item" />
                <label for="pistas-2-3-item"
                  >Caso o bloco da pista seja um CONFRONTO, o jogador deve jogar
                  um dado de 6 lados e somar o atributo PODER, quem perder,
                  perde um ponto</label
                >
              </li>
              <li>
                <input type="checkbox" id="pistas-2-3-item" />
                <label for="pistas-2-3-item"
                  >Nenhum jogador pode ter pontuação negativa (valores abaixo de
                  0)</label
                >
              </li>
            </ul>
          </li>
        </ul>
        <button id="volume-btn" class="volume-btn">
          🔊 Música Tema Mario Kart
        </button>
      </section>

      <h2>Escolha seu personagem</h2>
      <div id="player-select"></div>

      <h2>Escolha seu inimigo</h2>
      <div id="enemy-select"></div>
      <button id="start-btn" class="start-btn">🏁 Iniciar corrida</button>
    </div>

    <script src="index.js" type="module"></script>
  </body>
</html>
